name: novel_read
description: "本地 TXT 小说阅读器：手机 + PC 双端，支持进度同步与 Windows 摸鱼伪装。"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: 2.6.1

  # 本地存储（Windows 使用 ffi 实现）
  sqflite: 2.4.3
  sqflite_common_ffi: 2.4.2+1
  path_provider: 2.1.5
  path: 1.9.1
  shared_preferences: 2.5.2

  # 文件导入
  file_picker: 12.1.2

  # 编码与哈希
  fast_gbk: 1.0.0
  crypto: 3.0.6

  # PC 摸鱼：窗口 / 托盘 / 全局热键
  window_manager: 0.4.3
  tray_manager: 0.4.0
  hotkey_manager: 0.2.3

  # 局域网同步
  shelf: 1.4.2
  shelf_router: 1.1.4
  http: 1.3.0
  qr_flutter: 4.1.0
  mobile_scanner: 7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
